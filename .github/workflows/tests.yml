name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1' # weekly, catches new Laravel releases (R8)

jobs:
  tests:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.stability }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, mbstring, intl
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - run: composer test

  databases:
    name: ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: mysql
            image: mysql:8.4
            port: 3306
            env: '{"MYSQL_ROOT_PASSWORD": "password", "MYSQL_DATABASE": "auditor"}'
            options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
          - database: mariadb
            image: mariadb:11
            port: 3306
            env: '{"MARIADB_ROOT_PASSWORD": "password", "MARIADB_DATABASE": "auditor"}'
            options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=5
          - database: pgsql
            image: postgres:17
            port: 5432
            env: '{"POSTGRES_PASSWORD": "password", "POSTGRES_DB": "auditor"}'
            options: --health-cmd=pg_isready --health-interval=10s --health-timeout=5s --health-retries=5

    services:
      db:
        image: ${{ matrix.image }}
        env: ${{ fromJSON(matrix.env) }}
        ports: ['${{ matrix.port }}:${{ matrix.port }}']
        options: ${{ matrix.options }}

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_pgsql, mbstring, intl
          coverage: none
      - run: composer update --prefer-dist --no-interaction
      - name: Run the whole suite against ${{ matrix.database }}
        env:
          DB_CONNECTION: ${{ matrix.database }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.port }}
          DB_DATABASE: auditor
          DB_USERNAME: ${{ matrix.database == 'pgsql' && 'postgres' || 'root' }}
          DB_PASSWORD: password
        run: vendor/bin/pest

  browser:
    name: Browser (a11y, CSP, theme)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sockets
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: composer update --prefer-dist --no-interaction
      - run: npm ci && npx playwright install --with-deps chromium
      - run: composer test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-screenshots
          path: tests/Browser/Screenshots

  benchmark:
    name: Benchmark (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer update --prefer-dist --no-interaction
      - run: vendor/bin/pest --group=benchmark
